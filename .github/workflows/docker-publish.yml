name: Publish Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  publish:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sofia-api
            context: .
            dockerfile: src/SOFIA.API/Dockerfile
          - image: sofia-presidio
            context: src/SOFIA.PresidioAPI
            dockerfile: src/SOFIA.PresidioAPI/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/soygustavofernandez/${{ matrix.image }}:uat
            ghcr.io/soygustavofernandez/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to UAT
    needs: [publish, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-sofia-uat
    steps:
      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --yes --only-show-errors

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.x'

      # The runner IP changes on every run and is not always inside Azure, so it gets a temporary SQL firewall rule
      - name: Allow this runner through the SQL firewall
        run: |
          runner_ip=$(curl --silent --show-error --fail https://api.ipify.org)
          az sql server firewall-rule create --resource-group "$RESOURCE_GROUP" --server sql-sofia-uat-gfs --name "github-run-${{ github.run_id }}-${{ github.run_attempt }}" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" --output none

      # Migrations run before the new API starts, so every script must stay compatible with the API version still running
      - name: Apply database migrations
        shell: bash
        env:
          UAT_SQL_CONNECTION: ${{ secrets.UAT_SQL_CONNECTION }}
        run: |
          # The repository is public: mask the password and drop any line that could echo the connection string
          password=$(sed -n 's/.*[Pp]assword=\([^;]*\).*/\1/p' <<< "$UAT_SQL_CONNECTION")
          if [ -n "$password" ]; then echo "::add-mask::$password"; fi

          # Later keywords win, so this gives the free tier time to resume from its pause
          connection="${UAT_SQL_CONNECTION%;};Connect Timeout=120"

          # A new firewall rule can take a few minutes to apply, so the attempts spread over about five minutes
          for attempt in 1 2 3 4 5 6; do
            echo "Applying migrations (attempt $attempt of 6)"
            if dotnet run --project src/SOFIA.DbUp --configuration Release -- "$connection" 2>&1 | grep --line-buffered -viE "connectionstring|password|pwd="; then
              exit 0
            fi
            sleep 30
          done
          echo "Migrations failed after 6 attempts"
          exit 1

      - name: Remove the temporary SQL firewall rule
        if: always()
        run: az sql server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server sql-sofia-uat-gfs --name "github-run-${{ github.run_id }}-${{ github.run_attempt }}" --yes || true

      - name: Deploy sofia-api
        run: az containerapp update --resource-group "$RESOURCE_GROUP" --name ca-sofia-api --image "ghcr.io/soygustavofernandez/sofia-api:${{ github.sha }}" --output none

      - name: Deploy sofia-presidio
        run: az containerapp update --resource-group "$RESOURCE_GROUP" --name ca-sofia-presidio --image "ghcr.io/soygustavofernandez/sofia-presidio:${{ github.sha }}" --output none

      - name: Check health
        run: |
          fqdn=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name ca-sofia-api --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "https://$fqdn/health"
